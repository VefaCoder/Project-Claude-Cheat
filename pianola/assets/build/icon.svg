<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1d2a5c"/>
      <stop offset="0.5" stop-color="#0e1330"/>
      <stop offset="1" stop-color="#06070f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc1ff" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#5cc1ff"/>
      <stop offset="1" stop-color="#d9f2ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a596ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a596ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a52" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffa968"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6d6d2"/>
      <stop offset="0.12" stop-color="#f6f6f2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pressed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d8fe0"/>
      <stop offset="1" stop-color="#9fdcff"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="0.8" stop-color="#2b2b31"/>
      <stop offset="1" stop-color="#16161a"/>
    </linearGradient>
    <radialGradient id="hit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd0ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3fb6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.42"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/></g>

  <g clip-path="url(#sq)">
    <!-- guide lines -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="3">
      <line x1="265" y1="100" x2="265" y2="650"/><line x1="430" y1="100" x2="430" y2="650"/>
      <line x1="594" y1="100" x2="594" y2="650"/><line x1="759" y1="100" x2="759" y2="650"/>
    </g>
    <!-- falling notes: glow copies first -->
    <rect x="300" y="300" width="96" height="346" rx="30" fill="#3fb6ff" opacity="0.65" filter="url(#soft)"/>
    <rect x="628" y="170" width="96" height="250" rx="30" fill="url(#violet)"/>
    <rect x="468" y="430" width="78" height="150" rx="26" fill="url(#orange)"/>
    <rect x="300" y="300" width="96" height="346" rx="30" fill="url(#blue)"/>
    <rect x="300" y="300" width="96" height="346" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5"/>
    <ellipse cx="348" cy="648" rx="190" ry="120" fill="url(#hit)"/>
    <!-- sparks -->
    <g fill="#dff3ff">
      <circle cx="258" cy="612" r="7" opacity="0.9"/><circle cx="228" cy="580" r="5" opacity="0.7"/>
      <circle cx="430" cy="600" r="6" opacity="0.85"/><circle cx="462" cy="566" r="4.5" opacity="0.6"/>
      <circle cx="292" cy="556" r="4" opacity="0.6"/><circle cx="402" cy="540" r="3.5" opacity="0.5"/>
    </g>
    <!-- felt -->
    <rect x="100" y="646" width="824" height="16" fill="#5e0f16"/>
    <rect x="100" y="646" width="824" height="3" fill="#ffffff" fill-opacity="0.35"/>
    <!-- keyboard -->
    <rect x="100" y="662" width="824" height="262" fill="#121214"/>
    <rect x="104" y="662" width="157" height="262" rx="14" fill="url(#white)"/>
    <rect x="269" y="662" width="157" height="262" rx="14" fill="url(#pressed)"/>
    <rect x="434" y="662" width="157" height="262" rx="14" fill="url(#white)"/>
    <rect x="599" y="662" width="157" height="262" rx="14" fill="url(#white)"/>
    <rect x="764" y="662" width="157" height="262" rx="14" fill="url(#white)"/>
    <rect x="100" y="662" width="824" height="22" fill="#000" fill-opacity="0.28"/>
    <rect x="212" y="656" width="96" height="160" rx="12" fill="url(#black)"/>
    <rect x="388" y="656" width="96" height="160" rx="12" fill="url(#black)"/>
    <rect x="710" y="656" width="96" height="160" rx="12" fill="url(#black)"/>
    <rect x="226" y="790" width="68" height="18" rx="6" fill="#ffffff" fill-opacity="0.09"/>
    <rect x="402" y="790" width="68" height="18" rx="6" fill="#ffffff" fill-opacity="0.09"/>
    <rect x="724" y="790" width="68" height="18" rx="6" fill="#ffffff" fill-opacity="0.09"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
</svg>
